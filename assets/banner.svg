<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="Tanveer Singh Dhawan, DevOps, SRE and Platform Engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#111C33"/>
      <stop offset="100%" stop-color="#0B1222"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22C55E" stop-opacity="1"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#22C55E" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="290" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="290" rx="16" fill="url(#grid)"/>
  <ellipse cx="830" cy="30" rx="300" ry="180" fill="url(#glowA)"/>
  <ellipse cx="150" cy="270" rx="290" ry="170" fill="url(#glowB)"/>

  <g>
    <rect x="384" y="32" width="232" height="28" rx="14" fill="#052E1B" stroke="#22C55E" stroke-opacity="0.5"/>
    <circle cx="404" cy="46" r="4" fill="#22C55E"/>
    <text x="418" y="50.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="2" fill="#4ADE80">OPEN TO REMOTE ROLES</text>
  </g>

  <text x="500" y="122" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="7" fill="#F8FAFC">TANVEER SINGH DHAWAN</text>

  <rect x="290" y="142" width="420" height="2.5" fill="url(#rule)"/>

  <text x="500" y="178" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="3" fill="#22C55E">DevOps  •  SRE  •  Platform Engineering</text>

  <text x="500" y="207" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#94A3B8">Kubernetes in production at scale  ·  GCP  ·  AWS  ·  Terraform  ·  ArgoCD</text>

  <g>
    <line x1="260" y1="248" x2="740" y2="248" stroke="url(#wire)" stroke-width="1.5"/>
    <circle cx="260" cy="248" r="6" fill="#0F172A" stroke="#22C55E" stroke-width="1.5"/>
    <circle cx="380" cy="248" r="6" fill="#0F172A" stroke="#22C55E" stroke-width="1.5"/>
    <circle cx="500" cy="248" r="7.5" fill="#22C55E" stroke="#4ADE80" stroke-width="1.5"/>
    <circle cx="620" cy="248" r="6" fill="#0F172A" stroke="#22C55E" stroke-width="1.5"/>
    <circle cx="740" cy="248" r="6" fill="#0F172A" stroke="#22C55E" stroke-width="1.5"/>
    <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="9" letter-spacing="1.6" fill="#64748B" text-anchor="middle">
      <text x="260" y="270">EDGE</text>
      <text x="380" y="270">INGRESS</text>
      <text x="500" y="270">GKE</text>
      <text x="620" y="270">SERVICES</text>
      <text x="740" y="270">DATA</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="999" height="289" rx="16" fill="none" stroke="#334155"/>
