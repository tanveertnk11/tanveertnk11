<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-label="Architecture of the platform Tanveer operated: Cloudflare edge across 100+ independent zones, GKE Ingress and Cloud Load Balancing, 100+ GKE clusters at roughly 30,000 requests per second running Node.js microservices with Workload Identity, and a data layer of CloudSQL PostgreSQL HA, MongoDB and Redpanda Kafka. Delivery via Terraform, Helm, ArgoCD, GitHub Actions and GitOps. Observability via OpenSearch centralized logging.">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0C1526"/>
    </linearGradient>
    <radialGradient id="aglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="410" rx="14" fill="url(#abg)"/>
  <ellipse cx="360" cy="260" rx="420" ry="240" fill="url(#aglow)"/>

  <text x="32" y="34" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2.4" fill="#64748B">PLATFORM I BUILT AND OPERATED</text>
  <rect x="316" y="29.5" width="376" height="1" fill="#1E293B"/>
  <text x="968" y="34" text-anchor="end" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#475569">employer-owned, no public repository</text>

  <!-- EDGE -->
  <g>
    <rect x="32" y="56" width="660" height="60" rx="10" fill="#131F35" stroke="#334155"/>
    <text x="52" y="90" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.8" fill="#64748B">EDGE</text>
    <line x1="150" y1="70" x2="150" y2="102" stroke="#1E293B"/>
    <text x="170" y="83" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#F1F5F9">Cloudflare</text>
    <text x="170" y="102" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#94A3B8">100+ domains on a re-architected independent-zone setup</text>
  </g>
  <path d="M354 121 L362 129 L370 121" fill="none" stroke="#22C55E" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- INGRESS -->
  <g>
    <rect x="32" y="134" width="660" height="60" rx="10" fill="#131F35" stroke="#334155"/>
    <text x="52" y="168" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.8" fill="#64748B">INGRESS</text>
    <line x1="150" y1="148" x2="150" y2="180" stroke="#1E293B"/>
    <text x="170" y="161" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#F1F5F9">GKE Ingress + Cloud Load Balancing</text>
    <text x="170" y="180" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#94A3B8">hardened fleet-wide, Cloud NAT tuned for cost and throughput</text>
  </g>
  <path d="M354 199 L362 207 L370 199" fill="none" stroke="#22C55E" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- COMPUTE -->
  <g>
    <rect x="32" y="212" width="660" height="100" rx="10" fill="#13233C" stroke="#22C55E" stroke-opacity="0.35"/>
    <text x="52" y="248" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.8" fill="#4ADE80">COMPUTE</text>
    <line x1="150" y1="228" x2="150" y2="296" stroke="#1E293B"/>
    <text x="170" y="242" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#F8FAFC">100+ GKE clusters  ·  ~30,000 requests per second</text>
    <text x="170" y="262" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#94A3B8">multi-tenant SaaS, Node.js microservices, Workload Identity, zero-downtime deploys</text>
    <g fill="#0F1B30" stroke="#22C55E" stroke-opacity="0.45">
      <rect x="170" y="276" width="22" height="18" rx="3"/>
      <rect x="198" y="276" width="22" height="18" rx="3"/>
      <rect x="226" y="276" width="22" height="18" rx="3"/>
      <rect x="254" y="276" width="22" height="18" rx="3"/>
      <rect x="282" y="276" width="22" height="18" rx="3"/>
      <rect x="310" y="276" width="22" height="18" rx="3"/>
      <rect x="338" y="276" width="22" height="18" rx="3"/>
      <rect x="366" y="276" width="22" height="18" rx="3"/>
      <rect x="394" y="276" width="22" height="18" rx="3"/>
      <rect x="422" y="276" width="22" height="18" rx="3"/>
    </g>
    <text x="456" y="290" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#64748B">and 90 more</text>
  </g>
  <path d="M354 317 L362 325 L370 317" fill="none" stroke="#22C55E" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- DATA -->
  <g>
    <rect x="32" y="330" width="660" height="60" rx="10" fill="#131F35" stroke="#334155"/>
    <text x="52" y="364" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.8" fill="#64748B">DATA</text>
    <line x1="150" y1="344" x2="150" y2="376" stroke="#1E293B"/>
    <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#CBD5E1" text-anchor="middle">
      <rect x="170" y="346" width="180" height="28" rx="14" fill="#0F1B30" stroke="#334155"/>
      <text x="260" y="364">CloudSQL / PostgreSQL HA</text>
      <rect x="362" y="346" width="92" height="28" rx="14" fill="#0F1B30" stroke="#334155"/>
      <text x="408" y="364">MongoDB</text>
      <rect x="466" y="346" width="140" height="28" rx="14" fill="#0F1B30" stroke="#334155"/>
      <text x="536" y="364">Redpanda / Kafka</text>
    </g>
  </g>

  <!-- DELIVERY -->
  <g>
    <rect x="716" y="56" width="252" height="156" rx="10" fill="#131F35" stroke="#334155"/>
    <text x="736" y="84" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.8" fill="#38BDF8">DELIVERY</text>
    <rect x="736" y="94" width="212" height="1" fill="#1E293B"/>
    <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#CBD5E1">
      <rect x="736" y="106" width="5" height="5" fill="#22C55E"/><text x="752" y="114">Terraform</text>
      <rect x="736" y="125" width="5" height="5" fill="#22C55E"/><text x="752" y="133">Helm</text>
      <rect x="736" y="144" width="5" height="5" fill="#22C55E"/><text x="752" y="152">ArgoCD</text>
      <rect x="736" y="163" width="5" height="5" fill="#22C55E"/><text x="752" y="171">GitHub Actions</text>
      <rect x="736" y="182" width="5" height="5" fill="#22C55E"/><text x="752" y="190">GitOps</text>
    </g>
  </g>

  <!-- OBSERVABILITY -->
  <g>
    <rect x="716" y="230" width="252" height="160" rx="10" fill="#131F35" stroke="#334155"/>
    <text x="736" y="258" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.8" fill="#38BDF8">OBSERVABILITY</text>
    <rect x="736" y="268" width="212" height="1" fill="#1E293B"/>
    <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#CBD5E1">
      <rect x="736" y="282" width="5" height="5" fill="#22C55E"/><text x="752" y="290">OpenSearch</text>
      <rect x="736" y="301" width="5" height="5" fill="#22C55E"/><text x="752" y="309">Centralized logging</text>
      <rect x="736" y="320" width="5" height="5" fill="#22C55E"/><text x="752" y="328">Monitoring</text>
      <rect x="736" y="339" width="5" height="5" fill="#22C55E"/><text x="752" y="347">Incident response</text>
      <rect x="736" y="358" width="5" height="5" fill="#22C55E"/><text x="752" y="366">High availability</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="999" height="409" rx="14" fill="none" stroke="#334155"/>
</svg>
