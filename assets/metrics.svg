<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Production footprint: 100 plus GKE clusters, roughly 30,000 requests per second, 50 percent cloud spend cut, 8 plus years engineering. Certified CKA, AWS Solutions Architect Associate, Google Professional Cloud DevOps Engineer.">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0C1526"/>
    </linearGradient>
    <radialGradient id="mglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="220" rx="14" fill="url(#mbg)"/>
  <ellipse cx="500" cy="0" rx="520" ry="150" fill="url(#mglow)"/>

  <text x="32" y="36" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2.4" fill="#64748B">PRODUCTION FOOTPRINT</text>
  <rect x="228" y="31" width="740" height="1" fill="#1E293B"/>

  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="125" y="106" font-size="42" font-weight="700" fill="#4ADE80">100+</text>
    <text x="125" y="132" font-size="12" font-weight="600" letter-spacing="1.4" fill="#CBD5E1">GKE CLUSTERS</text>
    <text x="125" y="150" font-size="10.5" fill="#64748B">operated in production</text>

    <text x="375" y="106" font-size="42" font-weight="700" fill="#4ADE80">~30K</text>
    <text x="375" y="132" font-size="12" font-weight="600" letter-spacing="1.4" fill="#CBD5E1">REQUESTS / SECOND</text>
    <text x="375" y="150" font-size="10.5" fill="#64748B">sustained on that fleet</text>

    <text x="625" y="106" font-size="42" font-weight="700" fill="#4ADE80">50%</text>
    <text x="625" y="132" font-size="12" font-weight="600" letter-spacing="1.4" fill="#CBD5E1">CLOUD SPEND CUT</text>
    <text x="625" y="150" font-size="10.5" fill="#64748B">no measurable perf loss</text>

    <text x="875" y="106" font-size="42" font-weight="700" fill="#4ADE80">8+</text>
    <text x="875" y="132" font-size="12" font-weight="600" letter-spacing="1.4" fill="#CBD5E1">YEARS ENGINEERING</text>
    <text x="875" y="150" font-size="10.5" fill="#64748B">5 of them leading teams</text>
  </g>

  <g stroke="#1E293B" stroke-width="1">
    <line x1="250" y1="62" x2="250" y2="152"/>
    <line x1="500" y1="62" x2="500" y2="152"/>
    <line x1="750" y1="62" x2="750" y2="152"/>
  </g>

  <rect x="32" y="168" width="936" height="1" fill="#1E293B"/>

  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle">
    <rect x="162" y="180" width="74" height="26" rx="13" fill="#152238" stroke="#334155"/>
    <text x="199" y="197" fill="#CBD5E1">CKA</text>

    <rect x="252" y="180" width="260" height="26" rx="13" fill="#152238" stroke="#334155"/>
    <text x="382" y="197" fill="#CBD5E1">AWS Solutions Architect Associate</text>

    <rect x="528" y="180" width="310" height="26" rx="13" fill="#152238" stroke="#334155"/>
    <text x="683" y="197" fill="#CBD5E1">Google Professional Cloud DevOps Engineer</text>
  </g>

  <rect x="0.5" y="0.5" width="999" height="219" rx="14" fill="none" stroke="#334155"/>
</svg>
